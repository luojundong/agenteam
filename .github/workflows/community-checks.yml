name: Community checks

# 社区检查只覆盖「ci.yml 不跑」的场景：来自 fork 的外部贡献 PR、以及手动 dispatch。
# 不再监听 push: branches:[main]——主线后端/前端测试已由 ci.yml 单一触发，
# 否则同一 push 会同时跑两份各 50~180 分钟的后端测试（双跑 + 调度割裂 = 伪随机失败）。
# 主线安全扫描（Trivy + OWASP）由 ci.yml 的 security 作业覆盖，本文件无需重复。
on:
  pull_request:
  workflow_dispatch:

# 公共贡献只使用本仓库的读取权限，不引用商业仓库、私有发布凭据或签发密钥。
permissions:
  contents: read

concurrency:
  group: community-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # 后端构建与测试统一引用 reusable workflow，定义见 backend-test.yml（单一事实源）。
  backend:
    name: 后端构建与测试 (Maven)
    uses: ./.github/workflows/backend-test.yml
    with:
      artifact-name: community-backend-tests

  # 前端质量与测试统一引用 reusable workflow，定义见 frontend-check.yml（单一事实源）。
  frontend:
    name: 前端质量与测试
    uses: ./.github/workflows/frontend-check.yml
    with:
      test-commands: |
        pnpm test:i18n
        pnpm test:navigation
        pnpm test:channel-auth
        pnpm test:schedule-actions
        pnpm test:resource-deletion
        pnpm test:conversation
      # 社区开源发布包合规检查（镜像输入 / 文件范围 / 源码归档 / mysql compose）
      run-release-checks: true

  release-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 复用社区只读权限模型：不申请 security-events: write，扫描结果以产物形式留存，不向 GitHub 代码扫描回写。
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Trivy 文件系统扫描（漏洞/密钥/配置）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          exit-code: 0
          skip-dirs: node_modules,agenteam-server/target,agenteam-web/.next,agenteam-web/node_modules
          format: sarif
          output: trivy-release.sarif
      - name: 保留 Trivy 扫描报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-trivy-scan
          path: trivy-release.sarif
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agenteam-server/pom.xml
      - name: OWASP 依赖检查（后端）
        working-directory: agenteam-server
        run: sh ./mvnw -B org.owasp:dependency-check-maven:10.0.4:check -DfailBuildOnCVSS=11 || true
      - name: 保留依赖检查报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-owasp-report
          path: agenteam-server/target/dependency-check-report.html
          retention-days: 7
          if-no-files-found: ignore
