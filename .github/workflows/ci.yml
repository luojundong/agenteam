name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: 前端质量门禁 (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenteam-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  frontend-tests:
    name: 前端测试套件
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: agenteam-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 已挂载且稳定通过的测试脚本（CI 必修门禁）
      - name: 运行测试套件
        run: |
          pnpm test:i18n
          pnpm test:home-task
          pnpm test:navigation
          pnpm test:resource-deletion
          pnpm test:forms
          pnpm test:channel-auth
          pnpm test:schedule-actions
          pnpm test:completion-notice
          pnpm test:workflow
          pnpm test:conversation-sidebar
          pnpm test:file-preview
          pnpm test:file-upload
          pnpm test:model-config
          pnpm test:tool-payload
          pnpm test:markdown
          pnpm test:conversation
          # 组件/钩子集成测试（此前 11 个未挂载套件，已修复并纳入门禁）
          pnpm test:components

  backend:
    name: 后端构建与测试 (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenteam-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: 后端编译与测试
        run: ./mvnw -B test

  security:
    name: 安全门禁 (P0)
    runs-on: ubuntu-latest
    # 上传 Trivy SARIF 到 GitHub 代码扫描需要写安全事件权限。
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: 依赖评审 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: 设置 pnpm / Node（前端漏洞扫描需要）
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml

      - name: 前端依赖漏洞扫描
        working-directory: agenteam-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Trivy 文件系统扫描（依赖 CVE + 密钥 + 配置误用）
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          # 跳过前端依赖树与构建产物，避免噪声淹没信号。
          skip-dirs: |
            agenteam-web/node_modules
            **/target
            .git

      - name: 上传 Trivy 结果到代码扫描
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy.sarif"
          category: "trivy"

      - name: 设置 JDK 21（OWASP Dependency-Check 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: OWASP Dependency-Check（后端 Maven 依赖 CVE 关联）
        # 首次需下载 NVD（数百 MB），较重；先以 non-blocking 暴露可见性，后续据误报调优后转 required。
        continue-on-error: true
        working-directory: agenteam-server
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:10.0.4:check -Dformats=HTML,JSON -DfailOnError=false

      - name: 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: agenteam-server/target/dependency-check-report.html
          if-no-files-found: ignore
