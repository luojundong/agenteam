name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: 前端质量门禁 (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenteam-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  frontend-tests:
    name: 前端测试套件
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: agenteam-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 已挂载且稳定通过的测试脚本（CI 必修门禁）
      - name: 运行测试套件
        run: |
          pnpm test:i18n
          pnpm test:home-task
          pnpm test:navigation
          pnpm test:resource-deletion
          pnpm test:forms
          pnpm test:channel-auth
          pnpm test:schedule-actions
          pnpm test:completion-notice
          pnpm test:workflow
          pnpm test:conversation-sidebar
          pnpm test:file-preview
          pnpm test:file-upload
          pnpm test:model-config
          pnpm test:tool-payload
          pnpm test:markdown
          pnpm test:conversation
          # 组件/钩子集成测试（此前 11 个未挂载套件，已修复并纳入门禁）
          pnpm test:components

  backend:
    name: 后端构建与测试 (Maven)
    runs-on: ubuntu-latest
    # 189 个测试类、每个数据库测试都会新建库并跑一遍全量 Flyway 迁移，实测 60~150 分钟；
    # 上限设为 240 分钟，避免异常挂起时长期占用 runner，也避免正常慢跑被误杀。
    timeout-minutes: 240
    defaults:
      run:
        working-directory: agenteam-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 沙盒与对象存储测试依赖本地镜像，缺少时沙盒相关用例会返回 503
      # "沙盒暂时无法使用"（与 community-checks.yml 保持一致）。
      # 注意：本作业 defaults 的 working-directory 是 agenteam-server，
      # 这两个路径相对仓库根目录，必须显式回到根目录，否则 docker build 会立刻失败。
      - name: 构建共有办公沙箱镜像
        working-directory: .
        run: docker build --tag agenteam/sandbox-office:local deploy/sandbox
      - name: 构建对象存储测试服务镜像
        working-directory: .
        run: docker build --tag agenteam/test-minio:2025-09-07-07c3a429 agenteam-server/src/test/resources/containers/minio
      # —— 临时诊断步骤（定位后移除）——
      # 后端全量测试需 60+ 分钟，为快速拿到 AuditEventApiTest 的上下文加载根因，
      # 先单独跑这一个用例并把结果写成注解；continue-on-error 保证不影响门禁结论。
      - name: 诊断：单独运行 AuditEventApiTest
        continue-on-error: true
        run: ./mvnw -B test -Dtest=AuditEventApiTest -DfailIfNoTests=false
      - name: 诊断：输出 AuditEventApiTest 失败根因
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET

          def emit(text):
              text = re.sub(r"\s+", " ", text or "").strip()
              print(f"::error::DIAG {text[:900]}")

          for path in sorted(glob.glob('target/surefire-reports/*AuditEventApiTest*.xml')):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for child in case:
                      if child.tag not in ('failure', 'error'):
                          continue
                      body = [b.strip() for b in (child.text or '').strip().splitlines() if b.strip()]
                      emit(f"{case.get('classname')} | {(child.get('message') or '')[:300]}")
                      caused = [b for b in body if b.startswith('Caused by')][:8]
                      if caused:
                          for c in caused:
                              emit(f"CAUSED: {c}")
                      at = [b for b in body if '.java:' in b][:5]
                      if at:
                          emit(f"AT: {' // '.join(at)}")
          PY
      # —— 临时诊断步骤结束 ——
      - name: 后端编译与测试
        run: ./mvnw -B test
      # 作业日志需要管理员权限才能下载，失败原因无法从外部读取；
      # 这里把失败用例与堆栈片段以 ::error 形式写成注解（注解可公开读取），便于定位。
      - name: 输出失败测试清单（供注解定位）
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET

          def emit(text):
              # 注解里换行会截断输出，统一压成单行
              text = re.sub(r"\s+", " ", text or "").strip()
              print(f"::error::{text[:900]}")

          for path in sorted(glob.glob('target/surefire-reports/*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for child in case:
                      if child.tag not in ('failure', 'error'):
                          continue
                      name = f"{case.get('classname')}#{case.get('name')}"
                      msg = (child.get('message') or '').strip().splitlines()
                      head = msg[0] if msg else child.tag
                      emit(f"{name} | {head}")
                      body = [b.strip() for b in (child.text or '').strip().splitlines() if b.strip()]
                      # 断言/报错所在行
                      at = [b for b in body if '(' in b and '.java:' in b][:3]
                      if at:
                          emit(f"{name} | AT: {' // '.join(at)}")
                      # 根因链：Spring 的真实原因藏在 Caused by 里，只看首行无法定位
                      caused = [b for b in body if b.startswith('Caused by')][:6]
                      if caused:
                          emit(f"{name} | CAUSED: {' // '.join(caused)}")
                      elif body:
                          emit(f"{name} | STACK: {' // '.join(body[:5])}")
          PY
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: agenteam-server/target/surefire-reports
          if-no-files-found: ignore

  security:
    name: 安全门禁 (P0)
    runs-on: ubuntu-latest
    # 上传 Trivy SARIF 到 GitHub 代码扫描需要写安全事件权限。
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: 依赖评审 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: 设置 pnpm / Node（前端漏洞扫描需要）
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml

      - name: 前端依赖漏洞扫描
        working-directory: agenteam-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Trivy 文件系统扫描（依赖 CVE + 密钥 + 配置误用）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
          # 跳过前端依赖树与构建产物，避免噪声淹没信号。
          # Trivy 期望逗号分隔路径，写成多行块会被当成单个含换行的路径而失效。
          skip-dirs: "agenteam-web/node_modules,**/target,.git"
          # 与下方 OWASP 步骤一致：先以非阻塞方式暴露可见性。Trivy 新版本(v0.70+)
          # 对 skip-dirs 与退出码行为有变化，扫描自身异常不应阻断流水线；待按实际
          # 扫描结果调好阈值与跳过规则后，再转为阻塞门禁。
          continue-on-error: true

      - name: 上传 Trivy 结果到代码扫描
        if: always()
        # 上游扫描未产出文件时不应让作业失败（文件缺失已由扫描步骤本身暴露）。
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy.sarif"
          category: "trivy"

      - name: 设置 JDK 21（OWASP Dependency-Check 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: OWASP Dependency-Check（后端 Maven 依赖 CVE 关联）
        # 首次需下载 NVD（数百 MB），较重；先以 non-blocking 暴露可见性，后续据误报调优后转 required。
        continue-on-error: true
        working-directory: agenteam-server
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:10.0.4:check -Dformats=HTML,JSON -DfailOnError=false

      - name: 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: agenteam-server/target/dependency-check-report.html
          if-no-files-found: ignore
