name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 前端质量与测试统一引用 reusable workflow，定义见 frontend-check.yml（单一事实源）。
  frontend:
    name: 前端质量与测试
    uses: ./.github/workflows/frontend-check.yml
    with:
      test-commands: |
        pnpm test:i18n
        pnpm test:home-task
        pnpm test:navigation
        pnpm test:resource-deletion
        pnpm test:forms
        pnpm test:channel-auth
        pnpm test:schedule-actions
        pnpm test:completion-notice
        pnpm test:workflow
        pnpm test:conversation-sidebar
        pnpm test:file-preview
        pnpm test:file-upload
        pnpm test:model-config
        pnpm test:tool-payload
        pnpm test:markdown
        pnpm test:conversation
        # 组件/钩子集成测试（此前 11 个未挂载套件，已修复并纳入门禁）
        pnpm test:components

  # 后端构建与测试统一引用 reusable workflow，定义见 backend-test.yml（单一事实源）。
  backend:
    name: 后端构建与测试 (Maven)
    uses: ./.github/workflows/backend-test.yml

  security:
    name: 安全门禁 (P0)
    runs-on: ubuntu-latest
    # 上传 Trivy SARIF 到 GitHub 代码扫描需要写安全事件权限。
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: 依赖评审 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: 设置 pnpm / Node（前端漏洞扫描需要）
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agenteam-web/pnpm-lock.yaml

      - name: 前端依赖漏洞扫描
        working-directory: agenteam-web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: Trivy 文件系统扫描（依赖 CVE + 密钥 + 配置误用）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
          # 跳过前端依赖树与构建产物，避免噪声淹没信号。
          # Trivy 期望逗号分隔路径，写成多行块会被当成单个含换行的路径而失效。
          skip-dirs: "agenteam-web/node_modules,**/target,.git"
          # 与下方 OWASP 步骤一致：先以非阻塞方式暴露可见性。Trivy 新版本(v0.70+)
          # 对 skip-dirs 与退出码行为有变化，扫描自身异常不应阻断流水线；待按实际
          # 扫描结果调好阈值与跳过规则后，再转为阻塞门禁。
          continue-on-error: true

      - name: 上传 Trivy 结果到代码扫描
        if: always()
        # 上游扫描未产出文件时不应让作业失败（文件缺失已由扫描步骤本身暴露）。
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy.sarif"
          category: "trivy"

      - name: 设置 JDK 21（OWASP Dependency-Check 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: OWASP Dependency-Check（后端 Maven 依赖 CVE 关联）
        # 首次需下载 NVD（数百 MB），较重；先以 non-blocking 暴露可见性，后续据误报调优后转 required。
        continue-on-error: true
        working-directory: agenteam-server
        run: ./mvnw -B -ntp org.owasp:dependency-check-maven:10.0.4:check -Dformats=HTML,JSON -DfailOnError=false

      - name: 上传 Dependency-Check 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: agenteam-server/target/dependency-check-report.html
          if-no-files-found: ignore
